name: 16-1 - working with envs test

on:
  workflow_dispatch:

jobs:  
   deploy-staging: 
      runs-on: ubuntu-latest
      environment: staging
      env: 
        my-env-value: ${{ vars.MY_ENV_VAR || 'default-value' }}

      steps:
        - name: Echo vars
          run: |
            echo "Deploying to staging environment with variable: ${{ env.my-env-value }}"
   e2e-tests: 
      runs-on: ubuntu-latest
      needs: deploy-staging
      environment: staging
      env: 
        my-env-value: ${{ vars.MY_ENV_VAR || 'default-value' }}

      steps:
        - name: Echo vars
          run: |
            echo "Running e2e tests in staging environment with variable: ${{ env.my-env-value }}"    
   echo-production:
      runs-on: ubuntu-latest
      needs: e2e-tests

      environment: prod
      env: 
        my-env-value: ${{ vars.MY_ENV_VAR || 'default-value' }}

      steps:
        - name: Echo vars
          run: |
            echo "Deploying to production environment with variable: ${{ env.my-env-value }}"    

