name: Cache Node and NPM dependencies
description: "Allows actions Ricardo"

# antes de executar o aplicativo criar a pasta 17 e dentro dela criar o app react conforme comando abaixo
# npx create-react-app react-app --template typescript   # correct command
#rm -rf node_modules rm package-lock.json # ou yarn.lock, se usar Yarn
#npm install
#npm install yaml@2.8.2

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "20.x"
  working-dir:
    description: "Working directory from application"
    required: false
    default: "."
  target-env:
    description: '"dev" or "prod" deve ser escolhido'
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js version $ {{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
    - name: Cache Node modules
      id: cache-node-modules-id-ricardo
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-dir }}/node_modules
       # key: node-modules-${{ hashFiles('${{inputs.working-dir}}/package-lock.json') }}
        key: node-modules-${{ hashFiles(format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}
        #key: node-modules-${{ hashFiles('17-custom-actions/react-app/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache-node-modules-id-ricardo.outputs.cache-hit != 'true' 
      run: ${{ inputs.target-env == 'dev' && 'npm ci' || 'npm ci --omit=dev' }}
      shell: bash
      working-directory: ${{ inputs.working-dir }}